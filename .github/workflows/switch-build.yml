name: Switch build

# Manual only: the build needs the whole devkitPro toolchain and a host Meson tree,
# so it is run on demand rather than on every push. Not yet verified on GitHub runners.
on:
  workflow_dispatch:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build python3 python3-pip g++ pkg-config libwayland-dev wayland-protocols libx11-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxss-dev libxfixes-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libdrm-dev libgbm-dev libopenal-dev cmake libogg-dev libvorbis-dev libcurl4-openssl-dev zlib1g-dev libjpeg-dev libpng-dev libsdl2-dev libpipewire-0.3-dev libdecor-0-dev libibus-1.0-dev libsndio-dev libusb-1.0-0-dev libxtst-dev libxxf86vm-dev libjack-dev libsamplerate0-dev libtool
          pip3 install --break-system-packages "meson>=1.6"
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Syu --noconfirm && dkp-pacman -S --noconfirm switch-mesa switch-sdl2 switch-openal-soft && break
            echo "devkitPro package server refused (try $i), waiting"; sleep 90
          done
          dkp-pacman -Q switch-mesa switch-sdl2 switch-openal-soft
      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'
      - name: Configure host tree
        run: |
          meson setup build-host --buildtype release
          ninja -C build-host
      - name: Generate and build the NRO
        run: |
          python3 tools/switch/gen_ninja.py --host-build build-host --out build-switch --source-root "$PWD"
          ninja -C build-switch
      - uses: actions/upload-artifact@v4
        with:
          name: openQ4-nro
          path: build-switch/openQ4.nro
      - name: List content packs
        run: ls -lh build-host/baseoq4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: openQ4-content-packs
          path: build-host/baseoq4/pak*.pk4
          if-no-files-found: warn
